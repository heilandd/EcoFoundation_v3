[project]
name = "ecofoundation"
version = "0.1.0"
description = "Modular spatial transcriptomics analysis: unsupervised spatial clustering and GNN-based niche classification, with explainability and interactive HTML reports."
authors = [{ name = "Henrik Heiland" }]
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }

dependencies = [
    # Core scientific stack
    "numpy>=1.26,<3.0",
    "pandas>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    # Single-cell / spatial
    "anndata>=0.10",
    "scanpy>=1.10",
    "squidpy>=1.6",
    "h5py>=3.10",
    "igraph>=0.11",
    "leidenalg>=0.10",
    # Deep learning
    # NOTE: torch dropped Intel-Mac (x86_64) wheels after 2.2.x. We pin to that range for portability.
    # On Apple Silicon, Linux/CUDA and Windows, torch 2.2.x still has MPS / CUDA support.
    # Users who want a newer torch can bump these pins on supported platforms.
    "torch>=2.2,<2.3",
    "torch-geometric>=2.5,<2.6",
    "captum>=0.7",
    # Cell-cell communication
    "liana>=1.5",
    # Visualization
    "plotly>=5.20",
    "matplotlib>=3.8",
    # Config + validation
    "pydantic>=2.6",
    "pyyaml>=6.0",
    # Logging
    "loguru>=0.7",
    # Templating
    "jinja2>=3.1",
    # Utils
    "tqdm>=4.66",
    "joblib>=1.3",
    # Biological interpretation
    "gseapy>=1.0,<1.1",   # 1.1+ requires a Rust toolchain (no x86_64 macOS wheels)
    "umap-learn>=0.5",
    # Transitive pins for x86_64 macOS compatibility (no upstream wheels for newer versions).
    # Safe to bump on Apple Silicon / Linux / Windows.
    "numba>=0.59,<0.61",
    "llvmlite>=0.42,<0.45",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "ipykernel>=6.29",
    "nbformat>=5.9",
    "jupyter>=1.0",
]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecofoundation"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
markers = [
    "slow: marks tests as slow",
    "gpu: tests requiring CUDA or MPS",
]

[tool.mypy]
python_version = "3.11"
strict_optional = true
ignore_missing_imports = true
