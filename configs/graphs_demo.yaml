# Niche + Graph construction demo (Step 3).
# Uses overlap-filtered niches (supervised mode) + per-niche PyG graphs
# with HVG-subset expression as node features and tier-1 LR edge scores.

run_name: graphs_demo
run_dir: runs
seed: 0
device: auto

pipeline:
  name: niche_classification

data:
  path: /Users/henrikheiland/Desktop/Coding/EcoFoundation/scVI_adata_annotated.h5ad
  sample_id_col: samples
  patient_id_col: patient
  condition_col: sonicated
  celltype_col: celltype_level_1
  spatial_key: spatial
  counts_layer: counts
  normalized_layer: X_exp
  embedding_key: X_scVI

qc: { enabled: false }
normalization: { enabled: false }
hvg: { enabled: false }
leiden: { enabled: false }
markers: { enabled: false }

niches:
  strategy: knn
  knn_k: 50
  min_cells_per_niche: 10
  overlap_filter_enabled: true
  max_overlap_fraction: 0.2

graph:
  # User-requested default: expression as node features.
  # For Xenium 5K panels, the full 4700-dim feature is ok but slows GNN
  # training; we subset to HVGs by default for the demo. Switch to "all"
  # if you want the full panel.
  node_feature_source: expression
  node_expression_layer: X_exp
  gene_subset: hvg
  n_hvg: 500
  edge_topology: delaunay_intra_niche
  edge_feature_distance: true
  edge_feature_normalize_distance: true
  lr_scoring:
    enabled: true
    resource: omnipath_consensus
    method: mean
    aggregation: tier1_score

report:
  enabled: true
  title: EcoFoundation — Niche Graphs Demo (Step 3)
  plotly_inline: true
  spatial_max_points: 30000
